name = "bpm-rules-worker"
main = "src/worker.ts"
compatibility_date = "2025-10-25"

[vars]
ENV = "dev"

[[kv_namespaces]]
binding = "RULES_CACHE"
id = "kv_namespace_id_placeholder"

[[d1_databases]]
binding = "DB"
database_name = "bpm_rule_db"
database_id = "bpm-rule-db-local"

[[workflows]]
name = "bpm-process"
binding = "BPM_PROCESS"
class_name = "BPMWorkflow"
